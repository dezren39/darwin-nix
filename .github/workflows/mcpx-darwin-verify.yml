name: mcpx-darwin-verify (manual Darwin smoke check)
# Maintained manual aarch64-darwin mcpx build-and-run smoke check.
# Dispatch with workflow_dispatch; there is no push trigger.
# Ownership split: nightly Darwin package builds are owned by
# flake-packages-build.yml; this workflow owns the aarch64-darwin
# mcpx build-and-run smoke assertion (build
# .#packages.aarch64-darwin.mcpx, then run the built binary).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: aarch64-darwin mcpx
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Build aarch64-darwin mcpx
        run: |
          set -euo pipefail
          echo "runner: $(uname -s) $(uname -m)"
          nix build .#packages.aarch64-darwin.mcpx --print-build-logs --print-out-paths | tee "$RUNNER_TEMP/out"
          out="$(tail -n1 "$RUNNER_TEMP/out")"
          echo "out: $out"
          echo "--- $out/bin ---"
          ls -l "$out/bin"
      - name: Run the built binary
        run: |
          set -euo pipefail
          out="$(tail -n1 "$RUNNER_TEMP/out")"
          "$out/bin/mcpx" --help | head -40
          "$out/bin/mcpx" version || true
          nix eval --raw .#packages.aarch64-darwin.mcpx.version
