# The settings mcpx.config.nix starts kubernetes-mcp-server with (--config).
# Reference: https://github.com/containers/kubernetes-mcp-server/blob/main/docs/configuration.md
#
# read_only drops every write tool (pods_delete, pods_exec, pods_run,
# resources_create_or_update, resources_delete, resources_scale, helm
# install and uninstall); 17 read tools remain, checked 2026-11-24 with
# v0.1.3. The kubeconfig also reaches production clusters, and the server
# can read whatever the signed-in identity may read, so Secrets are refused
# outright. Both are the server's own guardrails; Kubernetes RBAC on the
# identity is the real boundary.
read_only = true
toolsets = ["config", "core", "helm"]

[[denied_resources]]
group = ""
version = "v1"
kind = "Secret"
