name: flake packages build

# CI policy: .github/ci-policy.md (design developing-today/code#1779
# §3.3/§3.4, as amended by #1172 — main-only tier).
#
# #49: mcpx-nixbuild.yml builds only .#packages.x86_64-linux.mcpx. This
# workflow covers every other package the flake exposes, so a broken
# package definition is caught by CI instead of by the next machine
# rebuild. mcpx stays owned by mcpx-nixbuild.yml and is excluded here
# to avoid building it twice.
#
# Main-only tier (#1172 removed the pull_request eval tier; #1178
# removed its leftover job; #1479 removed the push trigger, #1482):
# the nightly schedule + workflow_dispatch run the full build, one
# matrix job per package, fail-fast off so one broken package never
# hides another. There is no per-merge build: a broken merge is
# first built by the next nightly run (or a manual dispatch).
#
# Coverage is partitioned by system (#1850, mirroring #1832 in
# flake-checks-build.yml): the x86_64-linux packages build on
# ubuntu-latest and the aarch64-darwin packages on macos-15, each
# list enumerated from the flake for its own system. The mcpx
# exclusion above applies only to the x86_64-linux list — the
# aarch64-darwin mcpx output has no other build owner, so the
# darwin list is the flake's full aarch64-darwin package set.
#
# #1991: cai-claude-apim-proxy is excluded from BOTH lists. Its
# source input (github:vertexinc/cai-claude-apim-proxy) is behind
# vertexinc SAML — the tarball 404s and git access 403s from CI —
# so every cai-claude-apim-proxy job fails on the fetch (flake
# packages build run 45241870310). The package definition stays in
# the flake for hosts that can fetch the source; re-add it here
# once a fetchable source for the pinned rev exists.
# The runner is macos-15, not macos-14: macos-14 jobs in this repo
# are cancelled at assignment with no runner ever assigned
# (flake-checks-build run 43999325716; this workflow's first
# dispatch run 44029008656), while the repo's darwin verify
# workflows run successfully on macos-15.

on:
  schedule:
    # Nightly backstop for the full main-tier build (offset from the
    # mcpx workflow's 06:23 run).
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Same pattern as mcpx-nixbuild.yml: runs are keyed by run_id so a
  # later run can never cancel an earlier run's verification.
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  list-packages:
    name: list packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      darwin_packages: ${{ steps.list-darwin.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: List x86_64-linux packages (mcpx excluded — owned by mcpx-nixbuild; cai-claude-apim-proxy excluded — #1991 unfetchable source)
        id: list
        run: |
          set -euo pipefail
          packages="$(nix eval --json .#packages.x86_64-linux --apply 'attrs: builtins.filter (name: name != "mcpx" && name != "cai-claude-apim-proxy") (builtins.attrNames attrs)')"
          printf 'Packages: %s\n' "$packages"
          printf 'packages=%s\n' "$packages" >> "$GITHUB_OUTPUT"

      - name: List aarch64-darwin packages (cai-claude-apim-proxy excluded — #1991 unfetchable source)
        id: list-darwin
        run: |
          set -euo pipefail
          packages="$(nix eval --json .#packages.aarch64-darwin --apply 'attrs: builtins.filter (name: name != "cai-claude-apim-proxy") (builtins.attrNames attrs)')"
          printf 'Packages: %s\n' "$packages"
          printf 'packages=%s\n' "$packages" >> "$GITHUB_OUTPUT"

  nix-build:
    name: nix build ${{ matrix.package }}
    needs: list-packages
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.list-packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Nix build
        env:
          PACKAGE: ${{ matrix.package }}
        run: nix build ".#packages.x86_64-linux.${PACKAGE}" --print-build-logs

  nix-build-darwin:
    name: nix build (aarch64-darwin) ${{ matrix.package }}
    needs: list-packages
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.list-packages.outputs.darwin_packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Nix build
        env:
          PACKAGE: ${{ matrix.package }}
        run: nix build ".#packages.aarch64-darwin.${PACKAGE}" --print-build-logs
