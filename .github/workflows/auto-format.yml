name: auto-format

# Replication of the developing-today/code PoC (developing-today/code#2015,
# this repo's #1885): formatting is mechanical and NEVER gates a merge —
# no treefmt/format context is in any required check here either. This
# workflow runs treefmt on a 15-minute schedule and commits any fixes
# directly to main as the github-actions bot.
#
# Design (carried from the PoC, whose push trigger starved under its own
# concurrency group in 2026-11):
#   - every 15 minutes, format the files changed since the last
#     successful pass;
#   - the repo variable AUTO_FORMAT_LAST_SUCCESS_SHA stores the main
#     HEAD that pass pushed back (or verified clean); a run whose
#     HEAD still equals it exits immediately;
#   - cancel-in-progress is false: a pass is never cancelled, a
#     queued pass just finds the variable already advanced and exits.
# The variable is an optimization, not a correctness input: if it is
# missing, stale, or not an ancestor of HEAD, the run falls back to
# the last 25 hours of changed files, and a failed variable update
# only means the next run re-checks the same range.
#
# Triggers follow this repo's fleet policy (#1479): schedule and
# workflow_dispatch only — no push / pull_request triggers.
#
# Token adaptation (this repo has no REPO_AUTOMATION_TOKEN equivalent):
# pushes and the variable-write attempt use the workflow's default
# GITHUB_TOKEN with contents: write. Consequences, both acceptable by
# the PoC's own design: (1) the AUTO_FORMAT_LAST_SUCCESS_SHA write is
# best-effort — the default token cannot write repository variables,
# so record_success warns and the next run re-checks the fallback
# range (loop safety does not depend on it: a bot push made with
# GITHUB_TOKEN does not trigger new workflow runs, and a pass that
# finds nothing to change commits nothing); (2) bot pushes do not
# trigger downstream workflows. Upgrade path, when wanted: create a
# fine-grained PAT scoped to dezren39/darwin-nix only with Contents:
# read and write (plus Variables: read and write to make the success
# marker stick), store it as the repo Actions secret AUTO_FORMAT_TOKEN
# (the RENOVATE_BUN_SYNC_TOKEN precedent, #1060), and swap the two
# token references below — nothing else changes.
#
# Formatter adaptation: the PoC runs `nix run .#format`; this flake
# exposes the treefmt wrapper as its `formatter` output (treefmt.nix:
# nixfmt + rustfmt), so the pass runs `nix fmt -- <files>`, which
# forwards the changed-file list to that same wrapper.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# One format pass at a time on main; a pass is never cancelled
# mid-commit.
concurrency:
  group: auto-format-main
  cancel-in-progress: false

jobs:
  treefmt:
    name: treefmt auto-format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Format changed files with treefmt and commit any fixes
        env:
          LAST_SUCCESS_SHA: ${{ vars.AUTO_FORMAT_LAST_SUCCESS_SHA }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Record a successful pass: store the main HEAD this run
          # pushed back (or verified clean) so the next run can skip
          # or diff against it. Best-effort by design (see header).
          record_success() {
            local sha
            sha="$(git rev-parse HEAD)"
            if gh variable set AUTO_FORMAT_LAST_SUCCESS_SHA --body "$sha" 2>/dev/null; then
              echo "Recorded AUTO_FORMAT_LAST_SUCCESS_SHA=$sha"
            else
              echo "::warning::could not update AUTO_FORMAT_LAST_SUCCESS_SHA; the next run will re-check this range."
            fi
          }
          changed_file="$(mktemp)"
          trap 'rm -f "$changed_file"' EXIT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          max_attempts=3
          for ((attempt = 1; attempt <= max_attempts; attempt++)); do
            # A formatter commit is based on the checkout's main. Always
            # start from the latest remote tip so a push race can retry the
            # formatting pass rather than rebasing stale formatter output.
            git fetch origin main
            git reset --hard origin/main
            head_sha="$(git rev-parse HEAD)"
            if [[ -n "${LAST_SUCCESS_SHA:-}" && "$LAST_SUCCESS_SHA" == "$head_sha" ]]; then
              echo "main is unchanged since the last successful format pass ($head_sha); nothing to do."
              exit 0
            fi
            : > "$changed_file"
            if [[ -n "${LAST_SUCCESS_SHA:-}" ]] \
               && git cat-file -e "${LAST_SUCCESS_SHA}^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "$LAST_SUCCESS_SHA" HEAD; then
              git diff --name-only --diff-filter=ACMR "$LAST_SUCCESS_SHA...$head_sha" > "$changed_file"
            else
              git log --since="25 hours ago" --pretty=format: --name-only \
                | sort -u | while IFS= read -r f; do
                    if [[ -n "$f" && -f "$f" ]]; then
                      printf '%s\n' "$f"
                    fi
                  done > "$changed_file"
            fi
            mapfile -t changed_files < "$changed_file"
            if ((${#changed_files[@]} == 0)); then
              echo "No changed files to format."
              record_success
              exit 0
            fi
            # treefmt here covers .nix (nixfmt) and .rs (rustfmt) only,
            # so the write pass can never need to push a workflow file
            # (the one thing the default token cannot push).
            format_files=("${changed_files[@]}")
            printf 'Formatting %s file(s):\n' "${#format_files[@]}"
            printf '  %s\n' "${format_files[@]}"
            nix fmt -- "${format_files[@]}"
            # Stage every tracked change treefmt actually made, not just
            # the listed files: formatters rewrite companions of listed
            # files (rustfmt reformats out-of-line mod children of a
            # listed parent), and staging only the listed files either
            # silently dropped those companion changes or failed the
            # commit below with "no changes added to commit" (PoC #5014).
            # The checkout was clean before treefmt ran, so every
            # tracked modification present now is treefmt's. Decide
            # "nothing to commit" from the staged diff instead.
            git add -u
            if git diff --cached --quiet; then
              echo "treefmt made no changes."
              record_success
              exit 0
            fi
            git commit -m "style(treefmt): auto-format on main"
            if git push origin HEAD:main; then
              echo "Pushed auto-format commit."
              record_success
              exit 0
            fi
            echo "Push failed; checking whether main advanced during this pass."
            git fetch origin main
            main_sha="$(git rev-parse origin/main)"
            if [[ "$main_sha" == "$head_sha" ]]; then
              echo "::error::Auto-format push failed and main did not advance; not retrying the same revision."
              exit 1
            fi
            echo "main advanced during the format pass ($head_sha -> $main_sha); discarding stale formatter output and retrying against the latest main (attempt $attempt/$max_attempts)."
            git reset --hard origin/main
          done
          echo "::warning title=Auto-format retries exhausted::main kept advancing during all $max_attempts format passes; no success SHA was recorded, so the next scheduled run will retry."
          exit 75
